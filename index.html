<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><title>El misterio del cumple de Andrea</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a0f;color:#f3f0e7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:620px;margin:auto;padding:18px 0 34px}.case{background:linear-gradient(180deg,#11151d,#0d1016);border:1px solid #272d38;border-radius:22px;padding:24px 20px;box-shadow:0 18px 50px #0008}.center{text-align:center}.eyebrow{font-size:11px;letter-spacing:2px;color:#a9aeb9}.case h1,.case h2,.case h3{letter-spacing:.3px}.case h1{font-size:30px;line-height:1.08}.case h2{font-size:22px;line-height:1.25}.case h3{color:#e8d49a;letter-spacing:2px}.muted{color:#a9aeb9;line-height:1.6}.gold{color:#e8d49a}.rule{height:1px;background:#2a303b;margin:22px 0}.option,.primary{width:100%;border-radius:14px;padding:15px 14px;margin:7px 0;border:1px solid #303744;background:#171c25;color:#f4f2eb;font-size:16px;font-weight:600;text-align:left;transition:.2s}.option:active,.primary:active{transform:scale(.985)}.primary{background:linear-gradient(135deg,#e5c875,#b89645);color:#141414;border:0;text-align:center}.correct{border-color:#7cae82!important;background:#18301f!important}.wrong{border-color:#a55c5c!important;background:#32191b!important}.reveal{border:1px solid #665832;background:linear-gradient(180deg,#191711,#12110e);border-radius:18px;padding:22px;margin-top:16px}.unlock{font-size:42px;margin:8px 0 14px}.destination{font-size:22px;font-weight:800;color:#e8d49a;margin:10px 0}.archive{border:1px dashed #555b66;border-radius:16px;background:#0b0e13;margin:18px 0}.file{font-family:"Courier New",monospace;color:#737987;font-size:12px;letter-spacing:1px;line-height:1.7}.polaroid{width:min(88%,360px);margin:24px auto 16px;background:#f5f1e7;padding:12px 12px 22px;box-shadow:0 18px 38px #0009;transform:rotate(-2deg);color:#171717}.final-photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center}.polaroid-caption{font-family:Georgia,serif;font-size:14px;margin-top:12px;letter-spacing:.4px}.love{font-family:Georgia,serif;font-size:27px;color:#f0dfb0;margin:8px 0 2px}.status{display:inline-block;border:1px solid #46523e;color:#b9d7ad;border-radius:999px;padding:6px 10px;font-size:11px;letter-spacing:1px}.back{margin-bottom:16px;color:#858c98;font-size:12px;letter-spacing:1px}.code{font:28px "Courier New",monospace;letter-spacing:8px;margin:24px 0;color:#ead69b}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto 18px}.lock-icon{font-size:64px;margin:18px 0 10px;filter:drop-shadow(0 8px 20px #0008)}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}.count-box{border:1px solid #303744;background:#12161e;border-radius:14px;padding:13px 6px}.count-number{display:block;font-size:27px;font-weight:800;color:#e8d49a;line-height:1}.count-label{display:block;font-size:9px;letter-spacing:1.4px;color:#858c98;margin-top:7px}.locked-note{font-size:12px;letter-spacing:1.5px;color:#858c98}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}.keypad .option{text-align:center;margin:0}.small{font-size:13px}@media(max-width:390px){.case{padding:20px 16px}.case h1{font-size:26px}.case h2{font-size:20px}.option,.primary{font-size:15px;padding:14px 12px}}
</style>
</head><body><main id="app"></main>
<script>
const app=document.getElementById('app');
function shell(html){app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'})}
function header(t,n){return `<div class="back">🕵️ EXPEDIENTE #21 · ARCHIVO ${String(n).padStart(2,'0')}</div><div class="status">ESTADO DEL EXPEDIENTE: 🟢 ACTIVO</div><h1>${t}</h1>`}
function intro(){question1()}function updateCountdown(){const target=new Date('2026-11-13T09:00:00+01:00');const now=new Date();let ms=target-now;if(ms<=0){clearInterval(window.countdownTimer);window.countdownTimer=null;question1();return}const d=Math.floor(ms/86400000);ms-=d*86400000;const h=Math.floor(ms/3600000);ms-=h*3600000;const m=Math.floor(ms/60000);const sec=Math.floor((ms%60000)/1000);const el=document.getElementById('countdown');if(el)el.innerHTML='<div class="count-box"><span class="count-number">'+String(d).padStart(2,'0')+'</span><span class="count-label">DÍAS</span></div><div class="count-box"><span class="count-number">'+String(h).padStart(2,'0')+'</span><span class="count-label">HORAS</span></div><div class="count-box"><span class="count-number">'+String(m).padStart(2,'0')+'</span><span class="count-label">MINUTOS</span></div><div class="count-box"><span class="count-number">'+String(sec).padStart(2,'0')+'</span><span class="count-label">SEGUNDOS</span></div>'}function question1(){shell(`<section class="case">${header('PRUEBA 01 · PRIMERA PISTA',1)}<h2>¿Qué cenamos juntos en nuestra primera “cita”?</h2><button class="option" onclick="answer1(this,false)">🍣 Sushi</button><button class="option" onclick="answer1(this,false)">🥗 Poke</button><button class="option" onclick="answer1(this,true)">🍔 Hamburguesas</button><button class="option" onclick="answer1(this,false)">🌊 Cenamos en Campello</button><div id="result"></div></section>`)}
function answer1(btn,ok){document.querySelectorAll('.option').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');const r=document.getElementById('result');if(ok)r.innerHTML=`<div class="reveal"><h3>✅ RESPUESTA CORRECTA</h3><p>Parece que todavía recuerdas cómo empezó nuestra historia...</p><p class="gold"><strong>Primera pista desbloqueada. 🔓</strong></p><p>Pero esto solo acaba de empezar.</p></div><button class="primary" onclick="destination1()">CONTINUAR</button>`;else r.innerHTML=`<p class="gold">✕ Esa no era... pero puedes intentarlo otra vez.</p><button class="option" onclick="question1()">↻ INTENTAR DE NUEVO</button>`}
function destination1(){shell(`<section class="case center">${header('DESTINO DESBLOQUEADO',1)}<div class="destination">🌿 VALLE DE RICOTE</div><p>Prepárate, porque nuestra primera parada está esperándote.</p><div class="rule"></div><p>🥾 ~10 km<br>💧 Embalse de Ojós<br>⏱️ 2–3 horas</p><p class="gold">Tu próxima prueba aparecerá cuando terminemos la ruta.</p><button class="primary" onclick="question2()">CONTINUAR EL EXPEDIENTE</button></section>`)}
function question2(){shell(`<section class="case">${header('PRUEBA 02 · ARCHIVO CLASIFICADO',2)}<h2>¿Qué título de nuestro podcast favorito es el correcto?</h2><button class="option" onclick="answer2(this,false)">Black Mango: Misterios sin Resolver</button><button class="option" onclick="answer2(this,true)">Black Mango: Crímenes sin Resolver</button><button class="option" onclick="answer2(this,false)">Black Mango: Crímenes Aterradores</button><button class="option" onclick="answer2(this,false)">Black Mango: Misterios Aterradores</button><div id="result"></div></section>`)}
function answer2(btn,ok){document.querySelectorAll('.option').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');const r=document.getElementById('result');if(ok)r.innerHTML=`<div class="reveal"><div class="file">ARCHIVO #02 · DESCLASIFICADO<br>██████ CASA ██████</div><h3>ARCHIVO DESCLASIFICADO</h3><button class="primary" onclick="destination2()">ABRIR ARCHIVO</button></div>`;else r.innerHTML=`<p class="gold">✕ El archivo sigue bloqueado.</p><button class="option" onclick="question2()">↻ INTENTAR DE NUEVO</button>`}
function destination2(){shell(`<section class="case center">${header('ARCHIVO #02 · DESBLOQUEADO',2)}<div class="reveal"><div class="unlock">🔓</div><div class="destination">🏠 ABARÁN</div><p>Después de nuestra primera aventura del día toca hacer una pequeña pausa...</p><p><strong>🕐 Check-in: 13:00 – 15:00</strong></p><p class="gold">Pero no te acostumbres a saber dónde vamos. El expediente todavía tiene mucho que ocultar.</p></div><button class="primary" onclick="question3()">CONTINUAR EL EXPEDIENTE</button></section>`)}
function question3(){shell(`<section class="case">${header('PRUEBA 03 · CÓDIGO DE ACCESO',3)}<h2>¿Qué plan NO hemos hecho de los que hay aquí?</h2><button class="option" onclick="answer3(this,true)">🧖 Balneario</button><button class="option" onclick="answer3(this,false)">🛶 Kayak</button><button class="option" onclick="answer3(this,false)">🔐 Scape Room</button><button class="option" onclick="answer3(this,false)">🎾 Jugar al Pádel</button><div id="result"></div></section>`)}
function answer3(btn,ok){document.querySelectorAll('.option').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');const r=document.getElementById('result');if(ok)r.innerHTML=`<div class="reveal"><h3>CÓDIGO VERIFICADO...</h3><p>IDENTIDAD CONFIRMADA...</p><p>ACCESO CONCEDIDO...</p><div class="archive"><div class="file">🔒 RESERVA #03<br>FECHA: 13 NOVIEMBRE<br>HORA: 17:15<br>DESTINO: █████████████</div></div></div><button class="primary" onclick="code3()">INTRODUCIR CÓDIGO</button>`;else r.innerHTML=`<p class="gold">✕ El archivo no reconoce esa respuesta.</p><button class="option" onclick="question3()">↻ INTENTAR DE NUEVO</button>`}
function code3(){shell(`<section class="case center">${header('SEGURIDAD · CÓDIGO #03',3)}<h2>Introduce el código secreto</h2><p class="gold">💡 <strong>PISTA</strong></p><p>Tu cumple y el mío se pueden leer al revés y siempre estarán bien.</p><div id="codeDisplay" class="code">____</div><div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="option" onclick="pressCode(${n})">${n}</button>`).join('')}<button class="option" onclick="clearCode()">⌫</button><button class="option" onclick="pressCode(0)">0</button><button class="option" onclick="submitCode()">✓</button></div><p id="codeMsg" class="muted"></p></section>`);window.secretCode='' }
function pressCode(n){if(window.secretCode.length<4){window.secretCode+=n;updateCode()}}function updateCode(){document.getElementById('codeDisplay').textContent=window.secretCode.padEnd(4,'_')}function clearCode(){window.secretCode='';updateCode();document.getElementById('codeMsg').textContent=''}function submitCode(){const m=document.getElementById('codeMsg');if(window.secretCode==='1221')destination3();else{m.textContent='✕ Código incorrecto. Piensa en la pista...';m.className='gold'}}
function destination3(){shell(`<section class="case center">${header('ARCHIVO #03 · DESBLOQUEADO',3)}<div class="reveal"><div class="unlock">🔓</div><h3>ACCESO CONCEDIDO</h3><div class="destination">🧖 BALNEARIO DE ARCHENA</div><p><strong>13 NOVIEMBRE · 17:15 — 19:15</strong></p></div><div class="rule"></div><p>Durante las próximas dos horas no hay pruebas.<br>No hay pistas.<br>No hay expedientes.</p><p><strong>Solo toca relajarse conmigo. ❤️</strong></p><p class="gold"><strong>Pero cuidado... el expediente #21 todavía no ha terminado.</strong></p><button class="primary" onclick="question4()">❤️ CONTINUAR EL EXPEDIENTE</button></section>`)}
function question4(){shell(`<section class="case">${header('PRUEBA 04 · ÚLTIMO ARCHIVO',4)}<h2>Después de todas las pistas de hoy, ¿cuál era realmente la misión del Expediente #21?</h2><p class="muted">Has llegado hasta aquí. Valle de Ricote. Nuestra casa. El balneario. Pero todavía queda una última misión.</p><div class="rule"></div><button class="option" onclick="answer4(this,false)">🗺️ Descubrir el destino secreto</button><button class="option" onclick="answer4(this,false)">🔐 Resolver todas las pruebas</button><button class="option" onclick="answer4(this,false)">✨ Encontrar el mejor plan del día</button><button class="option" onclick="answer4(this,true)">❤️ Pasar un día entero contigo</button><div id="result"></div></section>`)}
function answer4(btn,ok){document.querySelectorAll('.option').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');const r=document.getElementById('result');if(ok)r.innerHTML=`<div class="reveal center"><div class="unlock">🔓</div><h3>EXPEDIENTE COMPLETADO</h3><p>Exactamente.</p><p>Porque todos los lugares, todas las pruebas y todas las pistas de hoy solo eran una excusa para esto.</p><p><strong>Pasar mi día favorito con mi persona favorita. ❤️</strong></p></div><br><button class="primary" onclick="finalEnvelope()">💌 ABRIR EL ÚLTIMO SOBRE</button>`;else r.innerHTML=`<p class="gold">✕ Cerca... pero todavía hay algo más detrás de este expediente.</p><button class="option" onclick="question4()">↻ INTENTAR DE NUEVO</button>`}
function finalEnvelope(){shell(`<section class="case center">${header('EXPEDIENTE #21 · CASO RESUELTO',4)}<div class="archive" style="padding:28px 20px"><div class="file">████████████████████<br>ARCHIVO FINAL · CONFIDENCIAL<br>████████████████████</div><div class="unlock">💌</div><h2>ÚLTIMO ARCHIVO</h2><div class="rule"></div><div class="destination">🍷 MISIÓN FINAL</div><p>Esta noche no hay más pruebas.</p><p><strong>Nos vamos a cenar juntos en Abarán.</strong></p><p>Y cuando volvamos a casa...</p><p>🍷 unas cuantas botellas de vino<br>🛁 hidromasaje<br>❤️ tú y yo</p><div class="rule"></div><p class="gold"><strong>Expediente #21: CASO RESUELTO.</strong></p></div><button class="primary" onclick="finishCase()">❤️ TERMINAR EXPEDIENTE</button></section>`)}
function finishCase(){shell(`<section class="case center">${header('EXPEDIENTE #21 · FINAL',4)}<div class="unlock">❤️</div><h2>CASO RESUELTO</h2><p>Hoy no había ningún misterio que resolver.</p><p>Solo una excusa para pasar un día entero contigo.</p><div class="rule"></div><p class="gold"><strong>FELIZ CUMPLEAÑOS, ANDREA</strong></p><p class="love">Te quiero ❤️</p><div class="polaroid"><img class="final-photo" src="https://raw.githubusercontent.com/nmonzotorrico-hash/expediente21/main/foto-andrea.jpeg" alt="Una foto de nosotros dos juntos" loading="eager"><div class="polaroid-caption">Expediente #21 · Nosotros</div></div><p class="muted">Expediente #21 · Caso resuelto.</p><p>Ahora sí. Cierra el expediente y disfruta del resto del día. ❤️</p></section>`)}
intro();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
